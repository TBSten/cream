[versions]
cream = "0.9.0"
agp = "8.12.3"
kotlin = "2.2.20"
android-minSdk = "24"
android-compileSdk = "36"
ksp = "2.2.20-2.0.4"
kotest = "6.1.11"
mockk = "1.14.6"
kctfork = "0.12.1"
kotlinPoet = "2.3.0"
konsist = "0.17.3"
ktlint = "1.7.1"
ktlintGradlePlugin = "13.1.0"

[libraries]
kotest = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotestFrameworkEngine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotestRunnerJunit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotestProperty = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotlinPoet = { module="com.squareup:kotlinpoet",version.ref = "kotlinPoet" }
kspApi = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kctforkCore = { module = "dev.zacsweers.kctfork:core", version.ref = "kctfork" }
kctforkKsp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
kotlinGradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinGradlePluginApi = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin-api", version.ref = "kotlin" }
ktlintGradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradlePlugin" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.34.0" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotest = { id = "io.kotest", version.ref = "kotest" }
ktlintGradle = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradlePlugin" }
